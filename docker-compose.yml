# Local development stack. Optional: you can also run the backend directly
# against Neon without Docker (see README).
#
#   docker compose up --build
#
# Postgres here is for local/offline work and tests; staging and production use Neon.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: hvac
      POSTGRES_PASSWORD: hvac_local_only
      POSTGRES_DB: hvac
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hvac -d hvac"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql+psycopg://hvac:hvac_local_only@db:5432/hvac
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
